spring:
  application:
    name: travel-policy-demo
  # the proxy credentials live in the slides repo's .env (YAML-compatible "KEY: value" lines)
  config:
    import:
      - optional:file:.env[.yaml]
      - optional:file:../.env[.yaml]
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      base-url: ${OPENAI_BASE_URL}
      chat:
        # Spring AI 2.1: use OpenAI's Responses API instead of Chat Completions
        api: responses
      responses:
        model: gpt-5-mini
        reasoning-effort: low

embabel:
  models:
    default-llm: gpt-5-mini

logging:
  level:
    # SimpleLoggerAdvisor logs on DEBUG
    org.springframework.ai.chat.client.advisor: DEBUG
