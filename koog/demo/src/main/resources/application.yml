spring:
  application:
    name: koog-travel-policy-demo
  # the proxy credentials live in a .env (YAML-compatible "KEY: value" lines) - here, in the slides repo
  # or shared with the rise-of-jvm-agents talk
  config:
    import:
      - optional:file:.env[.yaml]
      - optional:file:../.env[.yaml]
      - optional:file:../../the-rise-of-jvm-agents/.env[.yaml]
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      base-url: ${OPENAI_BASE_URL}
      chat:
        # Spring AI 2.1: use OpenAI's Responses API instead of Chat Completions
        api: responses
      responses:
        model: gpt-5-mini
        reasoning-effort: low
